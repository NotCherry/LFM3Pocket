plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.notcherry.lfm3pocket'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.notcherry.lfm3pocket'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.notcherry.lfm3pocket.UiE2eTestRunner'
        manifestPlaceholders = [appLabel: 'LFM3 Pocket']
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DGGML_NATIVE=OFF',
                          '-DGGML_OPENMP=OFF',
                          '-DGGML_LLAMAFILE=OFF',
                          '-DLLAMA_CURL=OFF',
                          '-DLLAMA_OPENSSL=OFF',
                          '-DGGML_BACKEND_DL=OFF',
                          '-DGGML_CPU_ALL_VARIANTS=OFF',
                          '-DLLAMA_BUILD_TESTS=OFF',
                          '-DLLAMA_BUILD_EXAMPLES=OFF',
                          '-DLLAMA_BUILD_SERVER=OFF'
                cppFlags '-std=c++17'
            }
        }
    }
    flavorDimensions += 'runtime'
    productFlavors {
        phone {
            dimension 'runtime'
            ndk { abiFilters 'arm64-v8a' }
        }
        smoke {
            dimension 'runtime'
            ndk { abiFilters 'x86_64' }
        }
        deviceCheck {
            dimension 'runtime'
            applicationIdSuffix '.devicecheck'
            manifestPlaceholders = [appLabel: 'LFM3 Pocket Device Test']
            testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    def camerax_version = '1.5.3'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // Room 2.8.5's migration-test reader uses serialization 1.8.1. Keep its
    // core/json runtime aligned with the version pulled into the app graph.
    implementation platform('org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1')
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

ksp { arg('room.schemaLocation', "$projectDir/schemas"); arg('room.generateKotlin', 'false') }
android.sourceSets.androidTest.assets.srcDirs += files("$projectDir/schemas")

