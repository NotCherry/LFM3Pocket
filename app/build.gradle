plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

apply from: rootProject.file('gradle/hanami-version.gradle')

def hanamiKeystore = System.getenv('HANAMI_KEYSTORE_FILE')
def hanamiStorePassword = System.getenv('HANAMI_STORE_PASSWORD')
def hanamiKeyAlias = System.getenv('HANAMI_KEY_ALIAS')
def hanamiKeyPassword = System.getenv('HANAMI_KEY_PASSWORD')
def hanamiSigningReady = hanamiKeystore && hanamiStorePassword && hanamiKeyAlias && hanamiKeyPassword
// Experimental spike (#164): opt-in Vulkan backend build. Requires Vulkan SDK/glslc
// and a host shader-gen toolchain for Android cross-build; CI/universal builds stay OFF.
def hanamiGgmlVulkan = (project.findProperty('hanami.ggmlVulkan')
        ?: System.getenv('HANAMI_GGML_VULKAN')
        ?: 'OFF').toString()
// Release / CI opt in: HANAMI_REQUIRE_DIZIONE or -Phanami.requireDizione=1 (-Phanami.requireDizione=0 to skip; F-Droid/default off).
def hanamiRequireDizioneProp = (project.findProperty('hanami.requireDizione')
        ?: System.getenv('HANAMI_REQUIRE_DIZIONE'))
// Phone release / ARM64 CI require the pinned Cactus Whistle runtime (scripts/fetch-cactus.sh).
// Smoke/x86_64 keeps the stub path when artifacts are absent.
def hanamiRequireCactus = (project.findProperty('hanami.requireCactus')
        ?: System.getenv('HANAMI_REQUIRE_CACTUS')
        ?: 'OFF').toString()
// Skip NDK/CMake/Rust work when running pure JVM unit tests or when -Phanami.skipNative=true
// is passed, preventing Gradle from auto-downloading the NDK or compiling .so files unused by JVM tests.
def hanamiSkipNativeProp = (project.findProperty('hanami.skipNative')
        ?: System.getenv('HANAMI_SKIP_NATIVE'))
def hanamiSkipNativeFlag = hanamiSkipNativeProp != null
        && hanamiSkipNativeProp.toString() in ['1', 'true', 'TRUE', 'ON', 'on', 'yes', 'YES']
def requestedGradleTasks = gradle.startParameter.taskNames.collect { it.toString() }
def isUnitTestOnlyInvocation = !requestedGradleTasks.isEmpty()
        && requestedGradleTasks.every { it ==~ /(?i).*unittest.*/ }
def skipNativeBuild = hanamiSkipNativeFlag || isUnitTestOnlyInvocation
// Opt-in ccache compiler launcher for CMake native builds (used in CI to cache llama.cpp objects
// by content hash across ephemeral runners without mtime invalidation).
def hanamiUseCcacheProp = (project.findProperty('hanami.useCcache')
        ?: System.getenv('HANAMI_USE_CCACHE'))
def hanamiUseCcache = hanamiUseCcacheProp != null
        && hanamiUseCcacheProp.toString() in ['1', 'true', 'TRUE', 'ON', 'on', 'yes', 'YES']
// Default deviceCheck packages both arm64-v8a and x86_64 for local emulator/device probes;
// CI ARM64 jobs pass -Phanami.deviceCheckAbis=arm64-v8a to avoid duplicate x86_64 builds.
def deviceCheckAbisProp = (project.findProperty('hanami.deviceCheckAbis')
        ?: System.getenv('HANAMI_DEVICE_CHECK_ABIS')
        ?: 'arm64-v8a,x86_64').toString()
def deviceCheckAbisList = deviceCheckAbisProp.split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }

android {
    // Source package stays put so the Java/Kotlin tree does not move.
    // Install id is applicationId below.
    namespace 'com.notcherry.lfm3pocket'
    compileSdk 35
    if (!skipNativeBuild) {
        ndkVersion '27.2.12479018'
    }

    defaultConfig {
        // New install id. Existing com.notcherry.lfm3pocket installs will not upgrade in place.
        applicationId 'dev.notcherry.hanami'
        minSdk 26
        targetSdk 35
        versionCode project.hanamiVersionCode
        versionName project.hanamiVersionName
        testInstrumentationRunner 'com.notcherry.lfm3pocket.UiE2eTestRunner'
        manifestPlaceholders = [appLabel: 'Hanami']
        if (!skipNativeBuild) {
            externalNativeBuild {
                cmake {
                    // GGML_NATIVE=OFF required for cross-compile (F-Droid / CI).
                    // GGML_OPENMP=OFF: Android NDK OpenMP is not supported by llama.cpp yet
                    // (same as llama.cpp docs/android.md and PocketPal/llama.rn).
                    // GGML_CPU_ARM_ARCH is set in CMakeLists.txt for arm64-v8a only
                    // (armv8.2-a+dotprod — PocketPal's preferred CPU ladder step).
                    def cmakeArgs = [
                              '-DANDROID_STL=c++_shared',
                              '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                              '-DGGML_NATIVE=OFF',
                              '-DGGML_OPENMP=OFF',
                              '-DGGML_LLAMAFILE=OFF',
                              '-DLLAMA_CURL=OFF',
                              '-DLLAMA_OPENSSL=OFF',
                              '-DGGML_BACKEND_DL=OFF',
                              '-DGGML_CPU_ALL_VARIANTS=OFF',
                              '-DGGML_CPU_KLEIDIAI=OFF',
                              '-DLLAMA_BUILD_COMMON=OFF',
                              '-DLLAMA_BUILD_TESTS=OFF',
                              '-DLLAMA_BUILD_EXAMPLES=OFF',
                              '-DLLAMA_BUILD_SERVER=OFF',
                              '-DLLAMA_BUILD_APP=OFF',
                              '-DLLAMA_SUBPROCESS=OFF',
                              '-DMTMD_VIDEO=OFF',
                              "-DHANAMI_GGML_VULKAN=${hanamiGgmlVulkan}",
                              "-DHANAMI_REQUIRE_CACTUS=${hanamiRequireCactus}"
                    ]
                    if (hanamiUseCcache) {
                        cmakeArgs.add('-DCMAKE_C_COMPILER_LAUNCHER=ccache')
                        cmakeArgs.add('-DCMAKE_CXX_COMPILER_LAUNCHER=ccache')
                    }
                    arguments(*cmakeArgs)
                    cppFlags '-std=c++17'
                }
            }
        }
    }
    flavorDimensions += 'runtime'
    productFlavors {
        phone {
            dimension 'runtime'
            ndk { abiFilters 'arm64-v8a' }
        }
        smoke {
            dimension 'runtime'
            ndk { abiFilters 'x86_64' }
        }
        deviceCheck {
            dimension 'runtime'
            applicationIdSuffix '.devicecheck'
            manifestPlaceholders = [appLabel: 'Hanami device test']
            testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            ndk { abiFilters(*deviceCheckAbisList) }
        }
    }
    if (!skipNativeBuild) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        localeFilters += ['en', 'pl']
    }
    buildFeatures {
        compose true
        aidl false
        renderScript false
        shaders false
        resValues false
        buildConfig false
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    if (hanamiSigningReady) {
        signingConfigs {
            release {
                storeFile file(hanamiKeystore)
                storePassword hanamiStorePassword
                keyAlias hanamiKeyAlias
                keyPassword hanamiKeyPassword
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hanamiSigningReady) signingConfig signingConfigs.release
        }
    }
    packaging {
        jniLibs {
            // Uncompressed 16 KB-aligned native libraries (extractNativeLibs=false) for Android 15-17 (ADR 0026).
            useLegacyPackaging false
        }
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/versions/9/previous-compilation-data.bin',
                'META-INF/*.version',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += file("$buildDir/rust-jni")
        }
    }
}

tasks.register('buildHanamiDizioneJni', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/build-dizione-jni.sh').absolutePath
    def requestedTasks = gradle.startParameter.taskNames.collect { it.toString() }
    def wantsDeviceCheck = requestedTasks.any { it ==~ /(?i).*devicecheck.*/ }
    def wantsSmoke = requestedTasks.any { it ==~ /(?i).*smoke.*/ }
    def wantsPhone = requestedTasks.any { it ==~ /(?i).*phone.*/ }
    def jniAbisSet = new LinkedHashSet<String>()
    if (requestedTasks.isEmpty() || (!wantsDeviceCheck && !wantsSmoke && !wantsPhone)) {
        jniAbisSet.addAll(['x86_64', 'arm64-v8a'])
    } else {
        if (wantsSmoke) jniAbisSet.add('x86_64')
        if (wantsPhone) jniAbisSet.add('arm64-v8a')
        if (wantsDeviceCheck) jniAbisSet.addAll(deviceCheckAbisList)
    }
    def jniAbis = jniAbisSet.join(',')
    environment 'HANAMI_BUILD_ABIS', jniAbis
    def requireDizione = hanamiRequireDizioneProp != null
            && hanamiRequireDizioneProp.toString() in ['1', 'true', 'TRUE', 'ON', 'on', 'yes', 'YES']
    environment 'HANAMI_REQUIRE_DIZIONE', requireDizione ? '1' : '0'
    ignoreExitValue = !requireDizione
}

if (!skipNativeBuild) {
    tasks.named('preBuild').configure { dependsOn buildHanamiDizioneJni }
}

dependencies {
    def camerax_version = '1.5.3'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // Room 2.8.5's migration-test reader uses serialization 1.8.1. Keep its
    // core/json runtime aligned with the version pulled into the app graph.
    implementation platform('org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1')
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (Android's stub throws "not mocked").
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    // 1.23.2+ ships 16 KB-aligned libonnxruntime4j_jni.so for Android 15-17 (ADR 0026).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'androidx.work:work-runtime:2.9.1'
}

ksp { arg('room.schemaLocation', "$projectDir/schemas"); arg('room.generateKotlin', 'false') }
// Room KSP reads and rewrites app/schemas/.../6.json; serialize flavor KSP tasks so
// multi-flavor Gradle builds (e.g. assemblePhoneDebug + assembleDeviceCheckDebug) never race.
afterEvaluate {
    def kspKotlinTasks = tasks.matching { it.name ==~ /ksp.*Kotlin/ && !it.name.contains('Test') }
            .toList()
            .sort { it.name }
    for (int i = 1; i < kspKotlinTasks.size(); i++) {
        kspKotlinTasks[i].mustRunAfter(kspKotlinTasks[i - 1])
    }
}
android.sourceSets.androidTest.assets.srcDirs += files("$projectDir/schemas")
// Apache-2.0 NOTICE/LICENSE for the optional Cactus runtime redistributed in phone ARM64 builds.
android.sourceSets.main.assets.srcDirs += file("${rootProject.projectDir}/licenses/cactus")

// Per-task ceilings so one hung suite cannot block CI indefinitely (see docs/TESTING.md).
tasks.withType(Test).configureEach { task ->
    if (task.name.contains('UnitTest')) {
        task.timeout = java.time.Duration.ofMinutes(10)
    }
}
tasks.matching { it.name ==~ /connected.*AndroidTest/ }.configureEach {
    // DeviceProviderInstrumentTestTask — not a Gradle Test subtype; local runs only (CI uses shell timeout).
    timeout = java.time.Duration.ofMinutes(48)
}

