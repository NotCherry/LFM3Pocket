plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

apply from: rootProject.file('gradle/hanami-version.gradle')

def hanamiKeystore = System.getenv('HANAMI_KEYSTORE_FILE')
def hanamiStorePassword = System.getenv('HANAMI_STORE_PASSWORD')
def hanamiKeyAlias = System.getenv('HANAMI_KEY_ALIAS')
def hanamiKeyPassword = System.getenv('HANAMI_KEY_PASSWORD')
def hanamiSigningReady = hanamiKeystore && hanamiStorePassword && hanamiKeyAlias && hanamiKeyPassword
// Experimental spike (#164): opt-in Vulkan backend build. Requires Vulkan SDK/glslc
// and a host shader-gen toolchain for Android cross-build; CI/universal builds stay OFF.
def hanamiGgmlVulkan = (project.findProperty('hanami.ggmlVulkan')
        ?: System.getenv('HANAMI_GGML_VULKAN')
        ?: 'OFF').toString()

android {
    // Source package stays put so the Java/Kotlin tree does not move.
    // Install id is applicationId below.
    namespace 'com.notcherry.lfm3pocket'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // New install id. Existing com.notcherry.lfm3pocket installs will not upgrade in place.
        applicationId 'dev.notcherry.hanami'
        minSdk 26
        targetSdk 35
        versionCode project.hanamiVersionCode
        versionName project.hanamiVersionName
        testInstrumentationRunner 'com.notcherry.lfm3pocket.UiE2eTestRunner'
        manifestPlaceholders = [appLabel: 'Hanami']
        externalNativeBuild {
            cmake {
                // GGML_NATIVE=OFF required for cross-compile (F-Droid / CI).
                // GGML_OPENMP=OFF: Android NDK OpenMP is not supported by llama.cpp yet
                // (same as llama.cpp docs/android.md and PocketPal/llama.rn).
                // GGML_CPU_ARM_ARCH is set in CMakeLists.txt for arm64-v8a only
                // (armv8.2-a+dotprod — PocketPal's preferred CPU ladder step).
                arguments '-DANDROID_STL=c++_shared',
                          '-DGGML_NATIVE=OFF',
                          '-DGGML_OPENMP=OFF',
                          '-DGGML_LLAMAFILE=OFF',
                          '-DLLAMA_CURL=OFF',
                          '-DLLAMA_OPENSSL=OFF',
                          '-DGGML_BACKEND_DL=OFF',
                          '-DGGML_CPU_ALL_VARIANTS=OFF',
                          '-DGGML_CPU_KLEIDIAI=OFF',
                          '-DLLAMA_BUILD_TESTS=OFF',
                          '-DLLAMA_BUILD_EXAMPLES=OFF',
                          '-DLLAMA_BUILD_SERVER=OFF',
                          "-DHANAMI_GGML_VULKAN=${hanamiGgmlVulkan}"
                cppFlags '-std=c++17'
            }
        }
    }
    flavorDimensions += 'runtime'
    productFlavors {
        phone {
            dimension 'runtime'
            ndk { abiFilters 'arm64-v8a' }
        }
        smoke {
            dimension 'runtime'
            ndk { abiFilters 'x86_64' }
        }
        deviceCheck {
            dimension 'runtime'
            applicationIdSuffix '.devicecheck'
            manifestPlaceholders = [appLabel: 'Hanami device test']
            testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    if (hanamiSigningReady) {
        signingConfigs {
            release {
                storeFile file(hanamiKeystore)
                storePassword hanamiStorePassword
                keyAlias hanamiKeyAlias
                keyPassword hanamiKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hanamiSigningReady) signingConfig signingConfigs.release
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += file("$buildDir/rust-jni")
        }
    }
}

tasks.register('buildHanamiDizioneJni', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', rootProject.file('scripts/build-dizione-jni.sh').absolutePath
    doFirst {
        def requested = gradle.startParameter.taskNames.collect { it.toLowerCase() }
        def wantsPhone = requested.any { it.contains('phone') }
        def wantsDeviceCheck = requested.any { it.contains('devicecheck') }
        def wantsSmoke = requested.any { it.contains('smoke') }
        // Default to all ABIs for safety/unrecognized task graphs.
        def abis = 'arm64-v8a,x86_64'
        if (wantsSmoke && !wantsPhone && !wantsDeviceCheck) {
            abis = 'x86_64'
        } else if (wantsPhone && !wantsSmoke && !wantsDeviceCheck) {
            abis = 'arm64-v8a'
        } else if (wantsDeviceCheck) {
            abis = 'arm64-v8a,x86_64'
        }
        environment 'HANAMI_BUILD_ABIS', abis
        // Backward-compatible signal for older scripts/invocations.
        environment.remove('HANAMI_BUILD_ALL_ABIS')
    }
    ignoreExitValue true
}

tasks.named('preBuild').configure { dependsOn buildHanamiDizioneJni }

dependencies {
    def camerax_version = '1.5.3'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // Room 2.8.5's migration-test reader uses serialization 1.8.1. Keep its
    // core/json runtime aligned with the version pulled into the app graph.
    implementation platform('org.jetbrains.kotlinx:kotlinx-serialization-bom:1.8.1')
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (Android's stub throws "not mocked").
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}

ksp { arg('room.schemaLocation', "$projectDir/schemas"); arg('room.generateKotlin', 'false') }
android.sourceSets.androidTest.assets.srcDirs += files("$projectDir/schemas")

