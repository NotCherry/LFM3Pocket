name: Antigravity PR Auto-Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: antigravity-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Antigravity Automated PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove Antigravity PR reviewer negative controls
        run: python3 .github/scripts/antigravity-pr-review.py --self-test

      - name: Run deterministic invariant audit and optional AI diff review
        id: audit
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          python3 .github/scripts/antigravity-pr-review.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --markdown-out pr-review.md \
            --gemini \
            --fail-on-error

      - name: Publish review to workflow summary
        if: always()
        run: |
          if [ -f pr-review.md ]; then
            cat pr-review.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post or update sticky PR review comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-review.md')) return;
            const body = fs.readFileSync('pr-review.md', 'utf8');
            const marker = '<!-- antigravity-pr-review -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce blocking static audit gate
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Antigravity PR Auto-Review detected blocking ERROR findings. See the PR comment or step summary." >&2
          exit 1
