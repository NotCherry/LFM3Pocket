name: E2E Flake Stress #194

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of repeated runs per target test'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress-194:
    name: Repeat #194 notification/resume E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Cache llama.cpp sources
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-cpp-${{ hashFiles('vendor/LLAMA_CPP_COMMIT') }}
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          bash scripts/fetch-llama.sh
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Cache voca sources
        uses: actions/cache@v4
        with:
          path: vendor/voca
          key: voca-${{ hashFiles('vendor/VOCA_COMMIT') }}
      - name: Fetch voca phonemizer (tiny-voca)
        run: bash scripts/fetch-voca.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install emulator-build SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Rust for dizione JNI
        run: rustup target add x86_64-linux-android
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache smoke native/CMake outputs
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
            app/build/intermediates/cmake
          key: smoke-native-${{ runner.os }}-ndk27.2.12479018-cmake3.22.1-bt35.0.0-api35-x86_64-vulkan-off-${{ hashFiles('vendor/LLAMA_CPP_COMMIT', 'vendor/VOCA_COMMIT', 'app/src/main/cpp/**', 'app/build.gradle', 'gradle.properties', 'scripts/build-dizione-jni.sh', 'scripts/fetch-llama.sh', 'scripts/fetch-voca.sh') }}
          restore-keys: |
            smoke-native-${{ runner.os }}-ndk27.2.12479018-cmake3.22.1-bt35.0.0-api35-x86_64-vulkan-off-
      - name: Cache checksum-verified smoke GGUF
        uses: actions/cache@v4
        with:
          path: app/src/androidTest/assets/stories15M-q4_0.gguf
          key: smoke-model-stories15m-q4-66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      - name: Provision SHA256-verified smoke GGUF
        run: bash .github/scripts/provision-smoke-model.sh
      - name: Cache Cargo (dizione JNI)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src/main/rust/hanami_dizione/target
          key: cargo-jni-${{ runner.os }}-${{ hashFiles('app/src/main/rust/hanami_dizione/Cargo.lock', 'app/src/main/rust/hanami_dizione/Cargo.toml', 'vendor/VOCA_COMMIT') }}
          restore-keys: |
            cargo-jni-${{ runner.os }}-
      - name: Assemble emulator app and instrumentation APKs
        run: gradle :app:assembleSmokeDebug :app:assembleSmokeDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM access for Android emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-ubuntu-api30-google_apis-x86_64-v3
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "Generated AVD snapshot for caching."
      - name: Run repeated #194 stress tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -Eeuo pipefail
            mkdir -p app/build/ci-artifacts/stress-194
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install -r app/build/outputs/apk/smoke/debug/app-smoke-debug.apk
            adb install -r app/build/outputs/apk/androidTest/smoke/debug/app-smoke-debug-androidTest.apk
            STRESS_RUNS="${{ inputs.runs }}" \
            STRESS_ARTIFACT_DIR="app/build/ci-artifacts/stress-194" \
              bash scripts/stress-flaky-e2e-194.sh
      - name: Upload #194 stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flake-194-stress-results
          path: |
            app/build/ci-artifacts/stress-194/
          if-no-files-found: warn
          retention-days: 14
