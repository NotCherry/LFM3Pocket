name: Publish GitHub Release
run-name: >-
  Publish GitHub Release (${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'latest') || github.ref_name }})

# Releases are published immediately on every non-doc merge/push to main without
# waiting for the deep emulator E2E suite in Android Stage 1 CI. Before creating
# any version tag or publishing an asset, this workflow runs JVM unit tests,
# builds the ARM64 release APK, and verifies JNI/Cactus/signature integrity so a
# broken build never consumes a version number.
#
# After publishing, older GitHub Releases beyond the newest 5 are pruned to keep
# storage minimal while preserving all git tags for monotonic versioning.
#
# Triggers:
#   - Non-doc push to main: bump/create a v* tag and publish Hanami-v<ver>-arm64-v8a.apk.
#   - Push v* tag: publish a versioned release for that exact tagged commit SHA.
#   - workflow_dispatch: rebuild rolling `latest` debug when no tag is supplied, or
#     publish/rebuild the supplied v* tag; both use the exact target commit SHA.
# Tag pushes with GITHUB_TOKEN do not re-trigger workflows, so auto-tagging and
# publishing stay in this one file.
#
# Signing secrets (optional on auto-release):
#   HANAMI_KEYSTORE_BASE64, HANAMI_STORE_PASSWORD, HANAMI_KEY_ALIAS, HANAMI_KEY_PASSWORD
# Missing secrets → unsigned APK with a clear note in the release body. Main stays green.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to publish (e.g. v0.1.0). Leave empty to rebuild Latest.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-github-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Verify & Publish APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ github.sha }}
      KEEP_RELEASES: '5'
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          # Need a token that can push the auto-release tag.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove release helper scripts
        run: |
          python3 .github/scripts/next-hanami-version.py --self-test
          python3 .github/scripts/prune-old-releases.py --self-test
          python3 .github/scripts/assert-dizione-jni-in-apk.py --self-test
          python3 .github/scripts/assert-cactus-runtime-in-apk.py --self-test

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          # Refresh tags so queued runs see tags pushed by an immediately preceding run.
          git fetch --tags --force origin
          short_sha() { echo "$1" | cut -c1-7; }

          if [ "$EVENT_NAME" = 'push' ] && [ "$REF_TYPE" = 'tag' ]; then
            tag="$REF_NAME"
            echo "mode=versioned" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ] && [ "$REF_NAME" = 'main' ]; then
            existing_tag="$(git tag --points-at "$PUSH_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1 || true)"
            if [ -n "$existing_tag" ]; then
              echo "Commit $PUSH_SHA is already tagged as $existing_tag; skipping duplicate auto-release."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
              echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
              echo "source=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            eval "$(python3 .github/scripts/next-hanami-version.py | sed 's/^/export /')"
            test -n "${tag:-}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists; refusing to republish from main." >&2
              exit 1
            fi
            echo "mode=versioned" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
            echo "bump=$bump" >> "$GITHUB_OUTPUT"
            echo "previous=$previous" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
            case "$tag" in
              v*) ;;
              *) echo "Dispatch tag must look like v0.1.0 (got: $tag)" >&2; exit 1 ;;
            esac
            echo "mode=versioned" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
          else
            sha="$PUSH_SHA"
            echo "mode=latest" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "name=Latest CI build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "asset=Hanami-latest-arm64-debug.apk" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
            echo "short_sha=$(short_sha "$sha")" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.meta.outputs.source == 'build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        if: steps.meta.outputs.source == 'build'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install phone-build SDK packages
        if: steps.meta.outputs.source == 'build'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        if: steps.meta.outputs.source == 'build'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify JVM unit contracts before release build
        if: steps.meta.outputs.source == 'build'
        timeout-minutes: 15
        run: gradle :app:testSmokeDebugUnitTest -Phanami.skipNative=true --no-daemon --stacktrace

      - name: Derive versionName and versionCode from the tag
        if: steps.meta.outputs.mode == 'versioned'
        id: version
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-version"
          javac -d "$RUNNER_TEMP/release-version" \
            app/src/main/java/com/notcherry/lfm3pocket/ReleaseVersion.java
          java -cp "$RUNNER_TEMP/release-version" com.notcherry.lfm3pocket.ReleaseVersion "$TAG" \
            | tee "$RUNNER_TEMP/version.txt"
          name="$(sed -n 's/^versionName=//p' "$RUNNER_TEMP/version.txt")"
          code="$(sed -n 's/^versionCode=//p' "$RUNNER_TEMP/version.txt")"
          test -n "$name"
          test -n "$code"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "asset=Hanami-v${name}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "name=Hanami $TAG" >> "$GITHUB_OUTPUT"

      - name: Decide signing
        id: signing
        if: steps.meta.outputs.mode == 'versioned'
        env:
          HANAMI_KEYSTORE_BASE64: ${{ secrets.HANAMI_KEYSTORE_BASE64 }}
          HANAMI_STORE_PASSWORD: ${{ secrets.HANAMI_STORE_PASSWORD }}
          HANAMI_KEY_ALIAS: ${{ secrets.HANAMI_KEY_ALIAS }}
          HANAMI_KEY_PASSWORD: ${{ secrets.HANAMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in HANAMI_KEYSTORE_BASE64 HANAMI_STORE_PASSWORD HANAMI_KEY_ALIAS HANAMI_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "HANAMI_* secrets are incomplete. Publishing an unsigned APK so main stays green."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.meta.outputs.mode == 'versioned' && steps.signing.outputs.mode == 'signed'
        env:
          HANAMI_KEYSTORE_BASE64: ${{ secrets.HANAMI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$HANAMI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hanami-release.keystore"
          test -s "$RUNNER_TEMP/hanami-release.keystore"

      - name: Cache llama.cpp sources
        if: steps.meta.outputs.source == 'build'
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-cpp-${{ hashFiles('vendor/LLAMA_CPP_COMMIT') }}
      - name: Fetch llama.cpp (LFM3-capable)
        if: steps.meta.outputs.source == 'build'
        run: |
          bash scripts/fetch-llama.sh
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Cache voca sources
        if: steps.meta.outputs.source == 'build'
        uses: actions/cache@v4
        with:
          path: vendor/voca
          key: voca-${{ hashFiles('vendor/VOCA_COMMIT') }}
      - name: Fetch voca phonemizer (tiny-voca)
        if: steps.meta.outputs.source == 'build'
        run: bash scripts/fetch-voca.sh
      - name: Set up Rust for dizione JNI
        if: steps.meta.outputs.source == 'build'
        run: rustup target add aarch64-linux-android

      - name: Cache Cactus Android arm64 runtime
        if: steps.meta.outputs.source == 'build'
        uses: actions/cache@v4
        with:
          path: third_party/cactus/arm64-v8a
          key: cactus-android-arm64-${{ hashFiles('vendor/CACTUS_RELEASE', 'vendor/CACTUS_HF_REVISION', 'vendor/CACTUS_ANDROID_ARM64.sha256') }}
      - name: Fetch Cactus Whistle runtime (arm64-v8a)
        if: steps.meta.outputs.source == 'build'
        run: bash scripts/fetch-cactus.sh

      - name: Set up ccache
        if: steps.meta.outputs.source == 'build'
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          mkdir -p "$HOME/.ccache"
          {
            echo "HANAMI_USE_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPILERCHECK=string:ndk-27.2.12479018"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_COMPRESS=true"
            echo "CCACHE_MAXSIZE=500M"
          } >> "$GITHUB_ENV"

      - name: Cache ccache (arm64-v8a release native)
        if: steps.meta.outputs.source == 'build'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-release-${{ runner.os }}-ndk27.2.12479018-arm64-v8a-vulkan-off-${{ hashFiles('vendor/LLAMA_CPP_COMMIT', 'vendor/CACTUS_ANDROID_ARM64.sha256', 'app/src/main/cpp/**', 'app/build.gradle') }}
          restore-keys: |
            ccache-release-${{ runner.os }}-ndk27.2.12479018-arm64-v8a-vulkan-off-
            ccache-phone-${{ runner.os }}-ndk27.2.12479018-arm64-v8a-vulkan-off-

      - name: Cache Cargo (dizione JNI)
        if: steps.meta.outputs.source == 'build'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src/main/rust/hanami_dizione/target
          key: cargo-jni-arm64-${{ runner.os }}-${{ hashFiles('app/src/main/rust/hanami_dizione/Cargo.lock', 'app/src/main/rust/hanami_dizione/Cargo.toml', 'vendor/VOCA_COMMIT') }}
          restore-keys: |
            cargo-jni-arm64-${{ runner.os }}-

      - name: Build signed ARM64 release APK
        if: steps.meta.outputs.mode == 'versioned' && steps.signing.outputs.mode == 'signed'
        env:
          HANAMI_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          HANAMI_KEYSTORE_FILE: ${{ runner.temp }}/hanami-release.keystore
          HANAMI_STORE_PASSWORD: ${{ secrets.HANAMI_STORE_PASSWORD }}
          HANAMI_KEY_ALIAS: ${{ secrets.HANAMI_KEY_ALIAS }}
          HANAMI_KEY_PASSWORD: ${{ secrets.HANAMI_KEY_PASSWORD }}
          HANAMI_REQUIRE_DIZIONE: '1'
          HANAMI_REQUIRE_CACTUS: 'ON'
        run: |
          ccache -z || true
          gradle :app:assemblePhoneRelease --no-daemon --stacktrace \
            -Phanami.versionName='${{ steps.version.outputs.version_name }}' \
            -Phanami.versionCode='${{ steps.version.outputs.version_code }}' \
            -Phanami.requireCactus=ON
          ccache -s || true

      - name: Build unsigned ARM64 release APK
        if: steps.meta.outputs.mode == 'versioned' && steps.signing.outputs.mode == 'unsigned'
        env:
          HANAMI_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          HANAMI_REQUIRE_DIZIONE: '1'
          HANAMI_REQUIRE_CACTUS: 'ON'
        run: |
          ccache -z || true
          gradle :app:assemblePhoneRelease --no-daemon --stacktrace \
            -Phanami.versionName='${{ steps.version.outputs.version_name }}' \
            -Phanami.versionCode='${{ steps.version.outputs.version_code }}' \
            -Phanami.requireCactus=ON
          ccache -s || true

      - name: Build ARM64 debug APK
        if: steps.meta.outputs.mode == 'latest' && steps.meta.outputs.source == 'build'
        env:
          HANAMI_REQUIRE_DIZIONE: '1'
          HANAMI_REQUIRE_CACTUS: 'ON'
        run: |
          ccache -z || true
          gradle :app:assemblePhoneDebug --no-daemon --stacktrace -Phanami.requireCactus=ON
          ccache -s || true

      - name: Stage release APK
        id: stage
        if: steps.meta.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.meta.outputs.mode }}
          SIGNING: ${{ steps.signing.outputs.mode }}
          ASSET: ${{ steps.version.outputs.asset || steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          if [ "$MODE" = 'versioned' ]; then
            if [ "$SIGNING" = 'signed' ]; then
              src='app/build/outputs/apk/phone/release/app-phone-release.apk'
            else
              src="$(find app/build/outputs/apk/phone/release -type f -name '*.apk' | head -n 1)"
            fi
          else
            src='app/build/outputs/apk/phone/debug/app-phone-debug.apk'
          fi
          test -s "$src"
          cp "$src" "release-out/$ASSET"
          if [ "$MODE" = 'versioned' ] && [ "$SIGNING" = 'signed' ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
            "$APKSIGNER" verify --print-certs "release-out/$ASSET" >/dev/null
          fi
          if [ "$MODE" = 'versioned' ] || [ "$MODE" = 'latest' ]; then
            python3 .github/scripts/assert-dizione-jni-in-apk.py "release-out/$ASSET" --abis arm64-v8a
            python3 .github/scripts/assert-cactus-runtime-in-apk.py "release-out/$ASSET"
          fi
          sha256sum "release-out/$ASSET" | tee "release-out/$ASSET.sha256"
          digest="$(cut -d' ' -f1 "release-out/$ASSET.sha256")"
          size_mb="$(python3 -c 'import os, sys; print(f"{os.path.getsize(sys.argv[1]) / (1024*1024):.1f}")' "release-out/$ASSET")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "size_mb=$size_mb" >> "$GITHUB_OUTPUT"
          ls -lh "release-out/$ASSET"

      - name: Create auto-release tag
        if: steps.meta.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          # Annotated tags need an identity; Actions runners do not set one.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "$TAG" "$SHA" -m "Hanami $TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        id: publish
        if: steps.meta.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.meta.outputs.mode }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.version.outputs.name || steps.meta.outputs.name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          ASSET: ${{ steps.version.outputs.asset || steps.meta.outputs.asset }}
          SHA: ${{ steps.meta.outputs.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SIGNING: ${{ steps.signing.outputs.mode }}
          BUMP: ${{ steps.meta.outputs.bump }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
          CREATE_TAG: ${{ steps.meta.outputs.create_tag }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          if [ "$MODE" = 'versioned' ]; then
            prev="${PREVIOUS:-}"
            if [ -z "$prev" ]; then
              prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
            fi
            changelog="$(mktemp)"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:'- %s' "${prev}..${SHA}" > "$changelog" || true
            else
              git log --no-merges -n 30 --pretty=format:'- %s' "$SHA" > "$changelog" || true
            fi
            if [ ! -s "$changelog" ]; then
              echo "- No commit subjects found between tags." > "$changelog"
            fi
            digest="$(cut -d' ' -f1 "release-out/$ASSET.sha256")"
            {
              echo "Hanami **$TAG** runs Liquid AI LFM3 models on device through llama.cpp. Model weights are not in the APK."
              echo
              if [ "${CREATE_TAG:-}" = 'true' ]; then
                echo "Automatic release from \`main\` (bump: \`${BUMP:-unknown}\`)."
                echo
              fi
              if [ "${SIGNING:-}" = 'unsigned' ]; then
                echo "> **Unsigned APK.** Repository secrets \`HANAMI_KEYSTORE_BASE64\`, \`HANAMI_STORE_PASSWORD\`, \`HANAMI_KEY_ALIAS\`, and \`HANAMI_KEY_PASSWORD\` are not all set. Main stayed green. Install only if you trust this build; Android will not upgrade a later signed APK over this package without uninstalling."
                echo
              fi
              echo "## Changes"
              echo
              cat "$changelog"
              echo
              echo "## Package"
              echo
              echo "- versionName: \`$VERSION_NAME\`"
              echo "- versionCode: \`$VERSION_CODE\`"
              echo "- applicationId: \`dev.notcherry.hanami\`"
              echo "- ABI: \`arm64-v8a\`"
              echo "- Asset: \`$ASSET\`"
              echo "- Signature: \`${SIGNING:-unknown}\`"
              echo "- SHA-256: \`$digest\`"
              echo "- Commit: \`$SHA\`"
              echo
              echo "Obtainium: track this GitHub repository, ignore pre-releases, and filter assets with \`Hanami-v.*-arm64-v8a\\.apk\`."
              echo
              echo "Install notes are in docs/RELEASING.md in this repository."
            } > "$notes_file"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "release-out/$ASSET" "release-out/$ASSET.sha256" --clobber
              gh release edit "$TAG" \
                --title "$NAME" \
                --notes-file "$notes_file" \
                --prerelease=false \
                --latest
            else
              create_args=(
                "$TAG" "release-out/$ASSET" "release-out/$ASSET.sha256"
                --title "$NAME"
                --notes-file "$notes_file"
                --target "$SHA"
                --latest
              )
              if [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref_type }}' = 'tag' ]; then
                create_args+=(--verify-tag)
              fi
              gh release create "${create_args[@]}"
            fi
          else
            {
              echo "Rolling ARM64 phone debug APK. This is not a signed Hanami release."
              echo
              echo "- Commit: \`$SHA\`"
              echo "- Asset: \`$ASSET\`"
              echo
              echo "Prefer a numbered \`v*\` release. Those assets are named \`Hanami-v<version>-arm64-v8a.apk\`."
            } > "$notes_file"
            if gh release view latest >/dev/null 2>&1; then
              gh release delete latest --yes --cleanup-tag
            fi
            gh release create latest "release-out/$ASSET" \
              --title "$NAME ($SHORT_SHA)" \
              --notes-file "$notes_file" \
              --target "$SHA" \
              --prerelease
          fi
          release_url="$(gh release view "$TAG" --json url --jq .url)"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Prune old GitHub Releases (keep last 5)
        id: prune
        if: steps.meta.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python3 .github/scripts/prune-old-releases.py \
            --repo "$GITHUB_REPOSITORY" \
            --keep "$KEEP_RELEASES" \
            --protect-tag "$TAG" \
            --api-url "$GITHUB_API_URL" \
            --token-env GH_TOKEN \
            --github-output "$GITHUB_OUTPUT"

      - name: Write release status summary
        if: always()
        env:
          MODE: ${{ steps.meta.outputs.mode }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha || env.RELEASE_SHA }}
          ASSET: ${{ steps.version.outputs.asset || steps.meta.outputs.asset }}
          SIGNING: ${{ steps.signing.outputs.mode }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
          SIZE_MB: ${{ steps.stage.outputs.size_mb }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          KEPT_COUNT: ${{ steps.prune.outputs.kept_count }}
          DELETED_COUNT: ${{ steps.prune.outputs.deleted_count }}
          FREED_MB: ${{ steps.prune.outputs.freed_mb }}
          KEPT_TAGS: ${{ steps.prune.outputs.kept_tags }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Hanami Release Summary"
            echo
            if [ "${MODE:-}" = 'skip' ]; then
              echo "- **Status:** Skipped (commit \`${SHA}\` is already tagged as \`${TAG}\`)"
            elif [ "${PUBLISH_OUTCOME:-}" = 'success' ]; then
              echo "- **Status:** Published"
              echo "- **Release:** [${TAG}](${RELEASE_URL})"
              echo "- **Asset:** \`${ASSET}\` (${SIZE_MB:-?} MB, signature: \`${SIGNING:-debug}\`)"
              echo "- **SHA-256:** \`${SHA256:-n/a}\`"
              echo "- **Commit:** \`${SHA}\`"
              echo "- **Retention:** Kept ${KEPT_COUNT:-?} release(s) (\`${KEPT_TAGS:-n/a}\`); pruned ${DELETED_COUNT:-0} older release(s) (${FREED_MB:-0.0} MB freed; git tags preserved)"
            else
              echo "- **Status:** Failed before publishing (no release created for \`${SHA}\`)"
              echo "- **Target tag:** \`${TAG:-unassigned}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
