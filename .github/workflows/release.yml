name: Publish GitHub Release

# Versioned releases on v* tags; rolling "Latest" prerelease after green main CI.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['Android Stage 1 CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to publish (e.g. v0.1.0). Leave empty to rebuild Latest.'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-github-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Attach APK to GitHub Release
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha() {
            echo "$1" | cut -c1-7
          }

          if [ "$EVENT_NAME" = 'push' ]; then
            tag="$REF_NAME"
            echo "mode=versioned" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "name=LFM3 Pocket $tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "asset=LFM3Pocket-${tag#v}-arm64-debug.apk" >> "$GITHUB_OUTPUT"
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
            case "$tag" in
              v*) ;;
              *) echo "Dispatch tag must look like v0.1.0 (got: $tag)" >&2; exit 1 ;;
            esac
            echo "mode=versioned" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "name=LFM3 Pocket $tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "asset=LFM3Pocket-${tag#v}-arm64-debug.apk" >> "$GITHUB_OUTPUT"
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            echo "source=build" >> "$GITHUB_OUTPUT"
          else
            sha="${RUN_SHA:-$PUSH_SHA}"
            echo "mode=latest" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest CI build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "asset=LFM3Pocket-latest-arm64-debug.apk" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = 'workflow_run' ]; then
              echo "source=artifact" >> "$GITHUB_OUTPUT"
              echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            else
              echo "source=build" >> "$GITHUB_OUTPUT"
            fi
            echo "short_sha=$(short_sha "$sha")" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK from Stage 1 CI
        if: steps.meta.outputs.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: LFM3Pocket-arm64-debug
          path: release-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.meta.outputs.run_id }}

      - name: Fetch llama.cpp (LFM3-capable)
        if: steps.meta.outputs.source == 'build'
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp rev-parse HEAD

      - name: Set up Java
        if: steps.meta.outputs.source == 'build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify runner Android SDK
        if: steps.meta.outputs.source == 'build'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install phone-build SDK packages
        if: steps.meta.outputs.source == 'build'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        if: steps.meta.outputs.source == 'build'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 phone APK
        if: steps.meta.outputs.source == 'build'
        run: gradle :app:assemblePhoneDebug --no-daemon --stacktrace

      - name: Stage release APK
        run: |
          set -euo pipefail
          mkdir -p release-out
          if [ '${{ steps.meta.outputs.source }}' = 'artifact' ]; then
            src="$(find release-apk -type f -name '*.apk' | head -n 1)"
          else
            src='app/build/outputs/apk/phone/debug/app-phone-debug.apk'
          fi
          test -s "$src"
          cp "$src" "release-out/${{ steps.meta.outputs.asset }}"
          ls -lh "release-out/${{ steps.meta.outputs.asset }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.meta.outputs.mode }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.meta.outputs.make_latest }}
          ASSET: ${{ steps.meta.outputs.asset }}
          SHA: ${{ steps.meta.outputs.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          RUN_ID: ${{ steps.meta.outputs.run_id }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          if [ "$MODE" = 'versioned' ]; then
            {
              echo "ARM64 phone debug APK for **$TAG**."
              echo
              echo "- Commit: \`$SHA\`"
              echo "- Flavor: \`phone\` / \`arm64-v8a\`"
              echo "- Model weights are **not** bundled; import LFM3 / LFM3-Omni GGUFs in-app."
              echo
              echo "See [docs/RELEASE.md](https://github.com/notcherry/lfm3pocket/blob/main/docs/RELEASE.md) for install notes."
            } > "$notes_file"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "release-out/$ASSET" --clobber
              gh release edit "$TAG" \
                --title "$NAME" \
                --notes-file "$notes_file" \
                --prerelease=false \
                --latest
            else
              create_args=(
                "$TAG" "release-out/$ASSET"
                --title "$NAME"
                --notes-file "$notes_file"
                --target "$SHA"
                --latest
              )
              # Tag push already created the annotated/lightweight tag; dispatch may not have.
              if [ '${{ github.event_name }}' = 'push' ]; then
                create_args+=(--verify-tag)
              fi
              gh release create "${create_args[@]}"
            fi
          else
            {
              echo "Rolling ARM64 phone debug APK from the latest green **main** CI run."
              echo
              echo "- Commit: \`$SHA\`"
              if [ -n "${RUN_ID:-}" ]; then
                echo "- CI run: https://github.com/notcherry/lfm3pocket/actions/runs/$RUN_ID"
              fi
              echo "- Asset: \`$ASSET\`"
              echo
              echo "Prefer a numbered \`v*\` release when available. Model weights are not bundled."
            } > "$notes_file"
            # Recreate so the moving \`latest\` tag tracks the newest green main commit.
            if gh release view latest >/dev/null 2>&1; then
              gh release delete latest --yes --cleanup-tag
            fi
            gh release create latest "release-out/$ASSET" \
              --title "$NAME ($SHORT_SHA)" \
              --notes-file "$notes_file" \
              --target "$SHA" \
              --prerelease
          fi
