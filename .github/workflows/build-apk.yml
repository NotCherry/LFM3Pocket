name: Android Stage 1 CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: JVM unit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install unit-test Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prove regression gate rejects failing or missing test results
        run: python3 .github/scripts/assert-android-test-results.py --self-test
      - name: Verify Stage 1 acceptance matrix completeness
        run: python3 .github/scripts/check-acceptance-matrix.py
      - name: Verify ARM64 evidence collector negative controls
        run: |
          bash -n .github/scripts/collect-arm64-omni-evidence.sh
          bash .github/scripts/collect-arm64-omni-evidence.sh --self-test
      - name: Execute JVM JUnit tests
        run: gradle :app:testSmokeDebugUnitTest --no-daemon --stacktrace
      - name: Upload JVM JUnit XML and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-jvm-unit-results
          path: |
            app/build/test-results/testSmokeDebugUnitTest/
            app/build/reports/tests/testSmokeDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  emulator-e2e:
    name: Android emulator JNI + UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install emulator-build SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache checksum-verified smoke GGUF
        uses: actions/cache@v4
        with:
          path: app/src/androidTest/assets/stories15M-q4_0.gguf
          key: smoke-model-stories15m-q4-66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      - name: Verify corrupted smoke GGUF is rejected
        run: |
          printf 'invalid GGUF contents' > "$RUNNER_TEMP/invalid.gguf"
          if bash .github/scripts/provision-smoke-model.sh --verify "$RUNNER_TEMP/invalid.gguf"; then
            echo 'ERROR: corrupted model fixture was accepted' >&2
            exit 1
          fi
      - name: Provision SHA256-verified smoke GGUF
        run: bash .github/scripts/provision-smoke-model.sh
      - name: Assemble emulator app and instrumentation APKs
        run: gradle :app:assembleSmokeDebug :app:assembleSmokeDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM access for Android emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute connected JNI smoke and real UI E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-jni-smoke.sh
      - name: Assert required tests actually executed and summarize JUnit
        if: always()
        run: python3 .github/scripts/assert-android-test-results.py app/build/outputs/androidTest-results/connected/
      - name: Upload emulator JUnit XML, screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-android-emulator-e2e-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install phone-build SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ARM64 APK
        run: gradle :app:assemblePhoneDebug :app:assembleDeviceCheckDebug :app:assembleDeviceCheckDebugAndroidTest --no-daemon --stacktrace
      - name: Assert ARM64 APK exists
        run: test -s app/build/outputs/apk/phone/debug/app-phone-debug.apk
      - name: Upload compiled ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-debug
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload isolated physical-device test APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-device-check
          path: |
            app/build/outputs/apk/deviceCheck/debug/app-deviceCheck-debug.apk
            app/build/outputs/apk/androidTest/deviceCheck/debug/app-deviceCheck-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30
