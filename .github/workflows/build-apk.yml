name: Android Stage 1 CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  unit:
    name: JVM unit contracts
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove runner selection stays off fork pull requests
        run: python3 .github/scripts/pick-runner.py --self-test
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prove regression gate rejects failing or missing test results
        run: |
          python3 .github/scripts/assert-android-test-results.py --self-test
          python3 .github/scripts/assert-instrumentation-result.py --self-test
          python3 .github/scripts/next-hanami-version.py --self-test
      - name: Verify Stage 1 acceptance matrix completeness
        run: python3 .github/scripts/check-acceptance-matrix.py
      - name: Verify ARM64 evidence collector negative controls
        run: |
          bash -n .github/scripts/collect-arm64-omni-evidence.sh
          bash .github/scripts/collect-arm64-omni-evidence.sh --self-test
      - name: Execute JVM JUnit tests
        run: gradle :app:testSmokeDebugUnitTest --no-daemon --stacktrace
      - name: Verify Room v4 schema was exported
        run: test -s app/schemas/com.notcherry.lfm3pocket.HistoryDatabase/4.json
      - name: Upload JVM JUnit XML and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-jvm-unit-results
          path: |
            app/build/test-results/testSmokeDebugUnitTest/
            app/build/reports/tests/testSmokeDebugUnitTest/
            app/schemas/com.notcherry.lfm3pocket.HistoryDatabase/4.json
          if-no-files-found: warn
          retention-days: 14

  emulator-e2e:
    name: Android emulator JNI + UI E2E
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: 90
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache checksum-verified smoke GGUF
        uses: actions/cache@v4
        with:
          path: app/src/androidTest/assets/stories15M-q4_0.gguf
          key: smoke-model-stories15m-q4-66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      - name: Verify corrupted smoke GGUF is rejected
        run: |
          printf 'invalid GGUF contents' > "$RUNNER_TEMP/invalid.gguf"
          if bash .github/scripts/provision-smoke-model.sh --verify "$RUNNER_TEMP/invalid.gguf"; then
            echo 'ERROR: corrupted model fixture was accepted' >&2
            exit 1
          fi
      - name: Provision SHA256-verified smoke GGUF
        run: bash .github/scripts/provision-smoke-model.sh
      - name: Assemble emulator app and instrumentation APKs
        run: gradle :app:assembleSmokeDebug :app:assembleSmokeDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM on the GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm is not present. The emulator job needs Linux KVM." >&2
            exit 1
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "/dev/kvm is already accessible to the runner user."
            exit 0
          fi
          # This runner is ephemeral. The rule does not persist onto CHERRY-TREE.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require existing KVM access on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "/dev/kvm is accessible to the runner user."
            exit 0
          fi
          echo "ERROR: /dev/kvm is not accessible to the runner user on this self-hosted machine." >&2
          echo "Add that user to the kvm group, then restart the runner service." >&2
          echo "This job does not install udev rules on CHERRY-TREE." >&2
          exit 1
      - name: Execute connected JNI smoke and real UI E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-jni-smoke.sh
      - name: Assert required tests actually executed and summarize JUnit
        if: always()
        run: python3 .github/scripts/assert-android-test-results.py app/build/outputs/androidTest-results/connected/
      - name: Upload emulator JUnit XML, screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-android-emulator-e2e-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Build ARM64 debug APK
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: 50
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ARM64 APK
        run: gradle :app:assemblePhoneDebug :app:assembleDeviceCheckDebug :app:assembleDeviceCheckDebugAndroidTest --no-daemon --stacktrace
      - name: Assert ARM64 APK exists
        run: test -s app/build/outputs/apk/phone/debug/app-phone-debug.apk
      - name: Verify effective native CPU optimization
        run: |
          python3 .github/scripts/assert-native-optimization.py --self-test
          python3 .github/scripts/assert-native-optimization.py app/.cxx
      - name: Upload compiled ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-debug
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload isolated physical-device test APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-device-check
          path: |
            app/build/outputs/apk/deviceCheck/debug/app-deviceCheck-debug.apk
            app/build/outputs/apk/androidTest/deviceCheck/debug/app-deviceCheck-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30
