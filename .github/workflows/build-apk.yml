name: Build Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          mkdir -p third_party
          git clone --depth 1 --branch v0.8.0 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble phone and smoke APKs
        run: |
          gradle :app:assemblePhoneDebug :app:assembleSmokeDebug :app:assembleSmokeDebugAndroidTest --no-daemon --stacktrace
      - name: Run native generation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          script: |
            gradle :app:connectedSmokeDebugAndroidTest --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/phone/debug/app-phone-debug.apk
          ls -lh app/build/outputs/apk/phone/debug/app-phone-debug.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-debug
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30

