name: Android Stage 1 CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      e2e_tier:
        description: 'Emulator E2E tier to run (smoke=fast PR gate, deep=full/nightly)'
        required: false
        default: deep
        type: choice
        options:
          - smoke
          - deep
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: JVM unit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install unit-test Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prove regression gate rejects failing or missing test results
        run: |
          python3 .github/scripts/assert-android-test-results.py --self-test
          python3 .github/scripts/assert-android-test-results.py --check-inventory
          python3 .github/scripts/assert-instrumentation-result.py --self-test
          python3 .github/scripts/next-hanami-version.py --self-test
          python3 .github/scripts/assert-release-ci-gate.py --self-test
          python3 .github/scripts/assert-dizione-jni-in-apk.py --self-test
          python3 .github/scripts/assert-cactus-runtime-in-apk.py --self-test
          bash -n scripts/fetch-cactus.sh
      - name: Verify Stage 1 acceptance matrix completeness
        run: python3 .github/scripts/check-acceptance-matrix.py
      - name: Verify UI color tokens (no ad-hoc hex in UI packages)
        run: python3 .github/scripts/check-ui-tokens.py
      - name: Verify ARM64 evidence collector negative controls
        run: |
          bash -n .github/scripts/collect-arm64-omni-evidence.sh
          bash .github/scripts/collect-arm64-omni-evidence.sh --self-test
      - name: Execute JVM JUnit tests
        # Hang diagnostics: background Gradle, periodic jstack every 90s while running.
        # Fail fast (~12m) instead of burning the full 30m job timeout when a unit test
        # deadlocks (seen after #233). Poll at 1s so we exit immediately when Gradle finishes.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p ci-diag
          : > gradle-jvm-tests.log
          gradle :app:testSmokeDebugUnitTest -Phanami.skipNative=true --no-daemon --stacktrace > gradle-jvm-tests.log 2>&1 &
          GRADLE_PID=$!
          tail -n +1 -F gradle-jvm-tests.log &
          TAIL_PID=$!
          echo "Gradle PID: $GRADLE_PID"
          status=0
          elapsed=0
          next_dump=90
          max_wait=720
          while kill -0 "$GRADLE_PID" 2>/dev/null && [ "$elapsed" -lt "$max_wait" ]; do
            sleep 1
            elapsed=$((elapsed + 1))
            if [ "$elapsed" -ge "$next_dump" ] && kill -0 "$GRADLE_PID" 2>/dev/null; then
              echo "--- Thread dump at +${elapsed}s ---" | tee -a ci-diag/thread-dumps.log
              jps -l | tee -a ci-diag/thread-dumps.log || true
              for pid in $(jps -q); do
                echo "--- jstack $pid ---" | tee -a ci-diag/thread-dumps.log
                jstack "$pid" >> ci-diag/thread-dumps.log 2>&1 || true
              done
              next_dump=$((next_dump + 90))
            fi
          done
          if kill -0 "$GRADLE_PID" 2>/dev/null; then
            echo "ERROR: JVM unit tests still running after ~12m; dumping threads and aborting" | tee -a ci-diag/thread-dumps.log
            for pid in $(jps -q); do
              jstack "$pid" >> ci-diag/thread-dumps.log 2>&1 || true
            done
            kill "$GRADLE_PID" 2>/dev/null || true
            wait "$GRADLE_PID" || true
            kill "$TAIL_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$GRADLE_PID" || status=$?
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          exit "$status"
      - name: Verify Room v4 and v5 schemas were exported
        run: |
          test -s app/schemas/com.notcherry.lfm3pocket.HistoryDatabase/4.json
          test -s app/schemas/com.notcherry.lfm3pocket.HistoryDatabase/5.json
      - name: Upload JVM JUnit XML and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-jvm-unit-results
          path: |
            gradle-jvm-tests.log
            ci-diag/
            app/build/test-results/testSmokeDebugUnitTest/
            app/build/reports/tests/testSmokeDebugUnitTest/
            app/schemas/com.notcherry.lfm3pocket.HistoryDatabase/4.json
          if-no-files-found: warn
          retention-days: 14

  emulator-e2e:
    name: Android emulator JNI + UI E2E (${{ github.event_name == 'pull_request' && 'smoke' || (github.event_name == 'workflow_dispatch' && inputs.e2e_tier || 'deep') }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || (github.event_name == 'workflow_dispatch' && inputs.e2e_tier || 'deep') }}
      # Bounded readiness (ADR 0023): 2×(boot 420s + 120s) + deep connected 45m must fit in job timeout-minutes: 90.
      EMULATOR_READY_TIMEOUT_S: 120
    steps:
      - name: Select E2E tier
        run: |
          echo "E2E_TIER=${E2E_TIER}"
          echo "e2e_tier=${E2E_TIER}" >> "$GITHUB_OUTPUT"
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Cache llama.cpp sources
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-cpp-${{ hashFiles('vendor/LLAMA_CPP_COMMIT') }}
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          bash scripts/fetch-llama.sh
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Cache voca sources
        uses: actions/cache@v4
        with:
          path: vendor/voca
          key: voca-${{ hashFiles('vendor/VOCA_COMMIT') }}
      - name: Fetch voca phonemizer (tiny-voca)
        run: bash scripts/fetch-voca.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install emulator-build SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Rust for dizione JNI
        run: rustup target add x86_64-linux-android
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache smoke native/CMake outputs
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
            app/build/intermediates/cmake
          key: smoke-native-${{ runner.os }}-ndk27.2.12479018-cmake3.22.1-bt35.0.0-api35-x86_64-vulkan-off-${{ hashFiles('vendor/LLAMA_CPP_COMMIT', 'vendor/VOCA_COMMIT', 'app/src/main/cpp/**', 'app/build.gradle', 'gradle.properties', 'scripts/build-dizione-jni.sh', 'scripts/fetch-llama.sh', 'scripts/fetch-voca.sh') }}
          restore-keys: |
            smoke-native-${{ runner.os }}-ndk27.2.12479018-cmake3.22.1-bt35.0.0-api35-x86_64-vulkan-off-
      - name: Cache checksum-verified smoke GGUF
        uses: actions/cache@v4
        with:
          path: app/src/androidTest/assets/stories15M-q4_0.gguf
          key: smoke-model-stories15m-q4-66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
      - name: Verify corrupted smoke GGUF is rejected
        run: |
          printf 'invalid GGUF contents' > "$RUNNER_TEMP/invalid.gguf"
          if bash .github/scripts/provision-smoke-model.sh --verify "$RUNNER_TEMP/invalid.gguf"; then
            echo 'ERROR: corrupted model fixture was accepted' >&2
            exit 1
          fi
      - name: Provision SHA256-verified smoke GGUF
        run: bash .github/scripts/provision-smoke-model.sh
      - name: Cache Cargo (dizione JNI)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src/main/rust/hanami_dizione/target
          key: cargo-jni-${{ runner.os }}-${{ hashFiles('app/src/main/rust/hanami_dizione/Cargo.lock', 'app/src/main/rust/hanami_dizione/Cargo.toml', 'vendor/VOCA_COMMIT') }}
          restore-keys: |
            cargo-jni-${{ runner.os }}-
      - name: Assemble emulator app and instrumentation APKs
        env:
          HANAMI_REQUIRE_DIZIONE: '1'
        run: gradle :app:assembleSmokeDebug :app:assembleSmokeDebugAndroidTest --no-daemon --stacktrace
      - name: Assert smoke APK packages dizione JNI (x86_64)
        run: python3 .github/scripts/assert-dizione-jni-in-apk.py app/build/outputs/apk/smoke/debug/app-smoke-debug.apk --abis x86_64
      - name: Enable KVM access for Android emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-ubuntu-api30-google_apis-x86_64-v3
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "Generated AVD snapshot for caching."
      - name: Execute connected JNI smoke and real UI E2E tests (attempt 1/2)
        id: emulator-e2e-1
        continue-on-error: true
        env:
          EMULATOR_INFRA_ATTEMPT: 1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          pre-emulator-launch-script: bash .github/scripts/emulator-pre-launch.sh 1
          script: bash .github/scripts/run-jni-smoke.sh "$E2E_TIER"
      - name: Decide emulator infrastructure retry (never retry real test failures)
        id: emulator-e2e-retry
        if: always() && steps.emulator-e2e-1.outcome == 'failure'
        run: bash .github/scripts/emulator-e2e-retry-gate.sh
      - name: Execute connected JNI smoke and real UI E2E tests (attempt 2/2)
        id: emulator-e2e-2
        if: steps.emulator-e2e-retry.outputs.retry == 'true'
        env:
          EMULATOR_INFRA_ATTEMPT: 2
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          pre-emulator-launch-script: bash .github/scripts/emulator-pre-launch.sh 2
          script: bash .github/scripts/run-jni-smoke.sh "$E2E_TIER"
      - name: Assert emulator E2E outcome (infra retry bounded to 2 starts)
        if: always()
        env:
          E2E_ATTEMPT_1_OUTCOME: ${{ steps.emulator-e2e-1.outcome }}
          E2E_INFRA_RETRY: ${{ steps.emulator-e2e-retry.outputs.retry }}
          E2E_ATTEMPT_2_OUTCOME: ${{ steps.emulator-e2e-2.outcome }}
        run: bash .github/scripts/emulator-e2e-finalize.sh
      - name: Assert required tests actually executed and summarize JUnit
        if: always()
        run: python3 .github/scripts/assert-android-test-results.py app/build/outputs/androidTest-results/connected/ --mode "$E2E_TIER"
      - name: Upload emulator JUnit XML, screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-android-emulator-e2e-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/ci-artifacts/
            app/build/ci-artifacts/attempt-1/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Build ARM64 debug APK
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Cache llama.cpp sources
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-cpp-${{ hashFiles('vendor/LLAMA_CPP_COMMIT') }}
      - name: Fetch llama.cpp (LFM3-capable)
        run: |
          bash scripts/fetch-llama.sh
          git -C third_party/llama.cpp rev-parse HEAD
      - name: Cache voca sources
        uses: actions/cache@v4
        with:
          path: vendor/voca
          key: voca-${{ hashFiles('vendor/VOCA_COMMIT') }}
      - name: Fetch voca phonemizer (tiny-voca)
        run: bash scripts/fetch-voca.sh
      - name: Cache Cactus Android arm64 runtime
        uses: actions/cache@v4
        with:
          path: third_party/cactus/arm64-v8a
          key: cactus-android-arm64-${{ hashFiles('vendor/CACTUS_RELEASE', 'vendor/CACTUS_HF_REVISION', 'vendor/CACTUS_ANDROID_ARM64.sha256') }}
      - name: Fetch Cactus Whistle runtime (arm64-v8a)
        run: bash scripts/fetch-cactus.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install phone-build SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Rust for dizione JNI
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache Cargo (dizione JNI)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src/main/rust/hanami_dizione/target
          key: cargo-jni-arm64-${{ runner.os }}-${{ hashFiles('app/src/main/rust/hanami_dizione/Cargo.lock', 'app/src/main/rust/hanami_dizione/Cargo.toml', 'vendor/VOCA_COMMIT') }}
          restore-keys: |
            cargo-jni-arm64-${{ runner.os }}-
      - name: Build ARM64 APK
        env:
          HANAMI_REQUIRE_DIZIONE: '1'
          HANAMI_REQUIRE_CACTUS: 'ON'
        run: gradle :app:assemblePhoneDebug :app:assembleDeviceCheckDebug :app:assembleDeviceCheckDebugAndroidTest --no-daemon --stacktrace -Phanami.requireCactus=ON
      - name: Assert ARM64 APK exists
        run: test -s app/build/outputs/apk/phone/debug/app-phone-debug.apk
      - name: Assert phone APK packages dizione JNI (arm64-v8a)
        run: python3 .github/scripts/assert-dizione-jni-in-apk.py app/build/outputs/apk/phone/debug/app-phone-debug.apk --abis arm64-v8a
      - name: Assert Cactus Whistle runtime is linked into the phone APK
        run: |
          python3 .github/scripts/assert-cactus-runtime-in-apk.py --self-test
          python3 .github/scripts/assert-cactus-runtime-in-apk.py app/build/outputs/apk/phone/debug/app-phone-debug.apk
      - name: Verify effective native CPU optimization
        run: |
          python3 .github/scripts/assert-native-optimization.py --self-test
          python3 .github/scripts/assert-native-optimization.py app/.cxx
      - name: Upload compiled ARM64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-debug
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload isolated physical-device test APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LFM3Pocket-arm64-device-check
          path: |
            app/build/outputs/apk/deviceCheck/debug/app-deviceCheck-debug.apk
            app/build/outputs/apk/androidTest/deviceCheck/debug/app-deviceCheck-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30
